<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DF95" />
      <stop offset="50%" stop-color="#CDA250" />
      <stop offset="100%" stop-color="#997022" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="50" cy="50" r="43" fill="url(#emblemGrad)" stroke="#CDA250" stroke-width="1" />
  
  <!-- Subtle Ray / Chakra Motif -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="#CDA250" stroke-width="0.75" stroke-dasharray="2,2" />
  
  <!-- Central Emblem: Shield with Civic Pillars & Accountability Balance -->
  <path d="M 50 18 L 68 25 C 68 39 59 52 50 58 C 41 52 32 39 32 25 Z" fill="#0B2545" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Civic Pillars inside Shield -->
  <rect x="42" y="27" width="3" height="15" fill="#FFFFFF" rx="1" />
  <rect x="48.5" y="25" width="3" height="17" fill="#CDA250" rx="1" />
  <rect x="55" y="27" width="3" height="15" fill="#FFFFFF" rx="1" />
  <!-- Pillar Pedestal & Arch -->
  <path d="M 40 26 L 60 26 L 50 21 Z" fill="#CDA250" />
  <rect x="39" y="42" width="22" height="2.5" fill="#CDA250" rx="0.5" />
  
  <!-- Laurel / Wheat of Public Welfare -->
  <path d="M 28 48 C 24 60 32 72 42 76" fill="none" stroke="#CDA250" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 72 48 C 76 60 68 72 58 76" fill="none" stroke="#CDA250" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Base Banner with Three Stars -->
  <polygon points="50,70 52,75 57,75 53,78 55,83 50,80 45,83 47,78 43,75 48,75" fill="#CDA250" />
  <polygon points="41,72 42.5,75.5 46,75.5 43,77.5 44.5,81 41,79 37.5,81 39,77.5 36,75.5 39.5,75.5" fill="#CDA250" />
  <polygon points="59,72 60.5,75.5 64,75.5 61,77.5 62.5,81 59,79 55.5,81 57,77.5 54,75.5 57.5,75.5" fill="#CDA250" />
</svg>
